<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherVault — Admin</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .vault-table { width: 100%; border-collapse: collapse; }
  .vault-table th, .vault-table td {
    text-align: left;
    padding: 0.7rem 0.6rem;
    border-bottom: 1px solid var(--glass-border);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  .vault-table th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; }
  .vault-table td.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    font-size: 0.72rem;
    background: rgba(79, 227, 208, 0.12);
    border: 1px solid rgba(79, 227, 208, 0.35);
    color: var(--cyan);
  }
  .badge-admin {
    background: rgba(255, 200, 87, 0.12);
    border-color: rgba(255, 200, 87, 0.4);
    color: var(--amber);
  }
  .empty-state { color: var(--text-dim); text-align: center; padding: 2rem 0; }
  .btn-small { padding: 0.35rem 0.8rem; font-size: 0.78rem; }
  .btn-danger { background: rgba(255, 107, 107, 0.15); border-color: rgba(255, 107, 107, 0.4); color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); }
  .section-title { font-family: var(--font-mono); font-size: 0.95rem; color: var(--violet); margin: 0 0 1rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  .stat-box {
    display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    padding: 1rem 0.5rem; border-radius: 12px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
  }
  .stat-value { font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700;
    background: linear-gradient(120deg, var(--cyan), var(--violet)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark">◈</span>
    <span class="brand-name">CipherVault</span>
    <span class="badge badge-admin" style="margin-left:0.5rem;">Admin</span>
  </div>
  <nav class="site-nav">
    <a href="index.html">Encrypt</a>
    <a href="admin.html" class="active">Admin</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="#" id="logout-link">Logout</a>
  </nav>
</header>

<main class="page">

  <section class="hero">
    <p class="eyebrow">accounts and vault items across all users</p>
    <h1>Admin panel.</h1>
  </section>

  <section class="panel" id="stats-panel">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-box"><span class="stat-value" id="stat-total-users">—</span><span class="stat-label">Total users</span></div>
      <div class="stat-box"><span class="stat-value" id="stat-admins">—</span><span class="stat-label">Admins</span></div>
      <div class="stat-box"><span class="stat-value" id="stat-regular">—</span><span class="stat-label">Regular users</span></div>
      <div class="stat-box"><span class="stat-value" id="stat-items">—</span><span class="stat-label">Vault items</span></div>
    </div>
  </section>

  <section class="panel">
    <h2 class="section-title">Users</h2>
    <table class="vault-table">
      <thead>
        <tr>
          <th>Email</th>
          <th>Role</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-body"></tbody>
    </table>
    <p class="empty-state hidden" id="users-empty">No users yet.</p>
  </section>

  <section class="panel">
    <h2 class="section-title">All vault items</h2>
    <table class="vault-table">
      <thead>
        <tr>
          <th>Filename</th>
          <th>Owner</th>
          <th>Algorithm</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="items-body"></tbody>
    </table>
    <p class="empty-state hidden" id="items-empty">No vault items yet.</p>
  </section>

</main>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
