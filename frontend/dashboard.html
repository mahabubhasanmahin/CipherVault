<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherVault — Vault</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .vault-table { width: 100%; border-collapse: collapse; }
  .vault-table th, .vault-table td {
    text-align: left;
    padding: 0.7rem 0.6rem;
    border-bottom: 1px solid var(--glass-border);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  .vault-table th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; }
  .vault-table td.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    font-size: 0.72rem;
    background: rgba(79, 227, 208, 0.12);
    border: 1px solid rgba(79, 227, 208, 0.35);
    color: var(--cyan);
  }
  .empty-state { color: var(--text-dim); text-align: center; padding: 2rem 0; }
  .btn-small { padding: 0.35rem 0.8rem; font-size: 0.78rem; }
  .btn-danger { background: rgba(255, 107, 107, 0.15); border-color: rgba(255, 107, 107, 0.4); color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark">◈</span>
    <span class="brand-name">CipherVault</span>
  </div>
  <nav class="site-nav">
    <a href="index.html">Encrypt</a>
    <a href="dashboard.html" class="active">Vault</a>
    <a href="#" id="logout-link">Logout</a>
  </nav>
</header>

<main class="page">

  <section class="hero">
    <p class="eyebrow">everything here is ciphertext — we can't read it either</p>
    <h1>Your vault.</h1>
  </section>

  <section class="panel">
    <table class="vault-table">
      <thead>
        <tr>
          <th>Filename</th>
          <th>Algorithm</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="vault-body">
      </tbody>
    </table>
    <p class="empty-state hidden" id="empty-state">Nothing saved yet — encrypt something and save it to your vault.</p>
  </section>

  <section class="panel hidden" id="share-result-panel">
    <h2>Share link created</h2>
    <textarea id="share-link-box" rows="2" readonly></textarea>
  </section>

</main>

<script src="js/config.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
